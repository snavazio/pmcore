[project]
name = "pmcore"
version = "0.1.0"
description = "PMCore - Purpose-built AI Project Management reasoning engine"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "datasets>=2.14.0",
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
    "sentencepiece>=0.1.99",
    "wandb>=0.16.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "peft>=0.18.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
